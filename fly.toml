app = "laya-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  NODE_ENV = "production"
  PORT = "4001"
  HOST = "0.0.0.0"
  CORS_ORIGIN = "*"
  ALLOW_BETA_TOKENS = "true"
